name: Request Info Workflow

# 1. Trigger the workflow manually via the GitHub Web UI
on:
  workflow_dispatch:
    # 2. Define the exact form inputs you want to request from the user
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          
      ticket_id:
        description: 'Jira or Issue Ticket ID'
        required: true
        type: string
        
      run_migrations:
        description: 'Run database migrations?'
        required: false
        type: boolean
        default: false

jobs:
  process-request:
    # Uses the current standard image label
    runs-on: ubuntu-latest
    
    steps:
      # Pulls your repository files onto the runner machine
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # 3. Accesses and outputs the requested user inputs via the github.event.inputs context
      - name: Output Requested Details
        run: |
          echo "Deploying to environment: ${{ github.event.inputs.environment }}"
          echo "Associated Ticket: ${{ github.event.inputs.ticket_id }}"
          echo "Run migrations option: ${{ github.event.inputs.run_migrations }}"
