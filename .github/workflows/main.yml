name: Process Input with JS

on:
  workflow_dispatch:
    inputs:
      user_message:
        description: 'Enter your message'
        required: true
        type: string

jobs:
  run-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Node.js script
        env:
          USER_TEXT: ${{ github.event.inputs.user_message }}
        run: node script.js
