name: Manual Input Workflow

# This trigger allows the workflow to be run manually from the GitHub Actions tab
on:
  workflow_dispatch:
    inputs:
      user_message:
        description: 'Enter a message for the workflow'
        required: true
        default: 'Hello, World!'
        type: string

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print the user input
        run: |
          echo "The message you entered is: ${{ github.event.inputs.user_message }}"
